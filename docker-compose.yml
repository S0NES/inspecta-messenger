# Inspecta — inspecta-messenger (mensageria: email/sms/whatsapp/push via fila q.notify).
# Exposto só para /v1/webhooks/{resend,infobip,expo} (entrega de status).
#
# inspecta-core é resolvido via Maven a partir do Reposilite (repositório interno no
# Dokploy) — o contexto de build é a própria pasta do inspecta-messenger, sem precisar clonar
# outros repos lado a lado.
#
#   cp .env.prod.example .env.prod && nano .env.prod
#   docker compose --env-file .env.prod up -d --build
#
# Pode subir junto com/depois do inspecta-worker — ambos só validam o schema
# (ddl-auto=validate), quem aplica o Flyway é sempre o inspecta-api.
name: inspecta-messenger

services:
  inspecta-messenger:
    build:
      context: .
      dockerfile: Dockerfile
    image: registry.inspecta.viniciusscarabelli.tech/inspecta-messenger:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: ${TZ:-America/Sao_Paulo}
      JAVA_TOOL_OPTIONS: ${MESSENGER_JAVA_OPTS:--XX:MaxRAMPercentage=70}
    deploy:
      # 1 réplica só: competing consumers em q.notify não exige mais que isso
      # no volume atual (arquitetura.md).
      replicas: 1
      resources:
        limits:
          memory: ${MESSENGER_MEM_LIMIT:-768m}
    healthcheck:
      # inspecta-messenger não tem Spring Security — /actuator/health é aberto por padrão.
      test: ["CMD-SHELL", "wget -qO- http://localhost:4100/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - dokploy-network
    labels:
      traefik.enable: "true"
      # Subdomínio dedicado (hooks.inspecta.viniciusscarabelli.tech): tudo que chega aqui é
      # webhook de broker (resend/infobip/expo), então roteia o host inteiro
      # em vez de PathPrefix — evita a colisão com /v1/webhooks/assinatura/autentique e
      # /v1/webhooks/pagamento/{provider}, que são do inspecta-api (ver Apêndice B
      # do docs/DEPLOY_HOSTINGER.md).
      traefik.http.routers.inspecta-messenger.rule: Host(`${HOOKS_HOST}`)
      traefik.http.routers.inspecta-messenger.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.inspecta-messenger.tls: "true"
      traefik.http.routers.inspecta-messenger.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-letsencrypt}
      traefik.http.routers.inspecta-messenger.service: inspecta-messenger
      traefik.http.services.inspecta-messenger.loadbalancer.server.port: "4100"
      traefik.http.services.inspecta-messenger.loadbalancer.healthcheck.path: /actuator/health
      traefik.http.services.inspecta-messenger.loadbalancer.healthcheck.interval: 10s
      traefik.http.services.inspecta-messenger.loadbalancer.healthcheck.timeout: 5s

networks:
  dokploy-network:
    external: true
